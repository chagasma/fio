name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Smoke check
        run: |
          ./target/release/fio --version
          workspace=$(mktemp -d)
          cd "$workspace"
          XDG_CONFIG_HOME="$workspace/config" XDG_CACHE_HOME="$workspace/cache" \
            "$GITHUB_WORKSPACE/target/release/fio" init --name smoke
          XDG_CONFIG_HOME="$workspace/config" XDG_CACHE_HOME="$workspace/cache" \
            "$GITHUB_WORKSPACE/target/release/fio" new first "First demand"

  # Verifies the lowest Rust version the dependencies and the standard library
  # APIs in use allow. Lower `rust-version` in Cargo.toml when this passes.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 build --locked --ignore-rust-version
