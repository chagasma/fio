name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Smoke check
        run: |
          ./target/release/fio --version
          workspace=$(mktemp -d)
          cd "$workspace"
          XDG_CONFIG_HOME="$workspace/config" XDG_CACHE_HOME="$workspace/cache" \
            "$GITHUB_WORKSPACE/target/release/fio" init --name smoke
          XDG_CONFIG_HOME="$workspace/config" XDG_CACHE_HOME="$workspace/cache" \
            "$GITHUB_WORKSPACE/target/release/fio" new first "First demand"

  # Builds with the `rust-version` declared in Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the minimum Rust version
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          echo "RUST_MIN=$version" >> "$GITHUB_ENV"
      - run: cargo +"$RUST_MIN" build --locked
