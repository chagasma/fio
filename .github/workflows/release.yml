name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    # An older runner links against an older glibc, so the binary runs on more systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo build --locked --release
      - name: Package
        run: |
          name="fio-$VERSION-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp target/release/fio LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Verify the packaged binary
        run: |
          tar xzf "$ARCHIVE"
          test "$("fio-$VERSION-x86_64-unknown-linux-gnu/fio" --version)" = "fio $VERSION"
          sha256sum --check "$ARCHIVE.sha256"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "fio $VERSION" \
            "$ARCHIVE" "$ARCHIVE.sha256"
