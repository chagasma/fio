[workspace]
members = ["."]
resolver = "3"

[package]
name = "fio"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Demand-based context manager for development with agents"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "AGENTS.md", ".claude/skills/fio/SKILL.md"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.13"
serde-saphyr = "1.3"
serde_json = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8.2"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
shell-words = "1.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
